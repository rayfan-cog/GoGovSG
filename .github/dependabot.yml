# Dependabot version updates for npm.
# Groups bundle packages that share upgrade constraints or break CI when bumped alone.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#groups
#
# Group order matters: the first matching group wins.
#
# Version updates are weekly and capped so they do not flood the PR queue.
# Non-major bumps are grouped into a few PRs that Mergify auto-merges (see
# .github/mergify.yml); major bumps stay as individual PRs for human/Devin
# review because they usually need code changes.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 10
    # Matches the build(deps...) title Mergify keys on and passes commitlint.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # --- Build toolchains (tight coupling) ---

      webpack:
        patterns:
          - webpack
          - webpack-cli
          - webpack-dev-server
          - html-webpack-plugin
          - clean-webpack-plugin
          - babel-loader
          - swc-loader

      typescript:
        patterns:
          - typescript
          - tsx

      babel:
        patterns:
          - '@babel/*'

      inversify:
        # reflect-metadata major must match inversify peer (e.g. v6 needs ~0.2.x)
        patterns:
          - inversify
          - reflect-metadata

      jest:
        patterns:
          - jest
          - '@swc/jest'
          - '@swc/core'
          - '@types/jest'
          - testcafe
          - supertest
          - '@types/supertest'
          - node-mocks-http

      # oxlint-tsgolint's version encodes the TypeScript version it embeds and
      # must stay paired with oxlint; oxlint-plugin-eslint tracks oxlint's release
      # cadence. eslint-plugin-import is a jsPlugin loaded by oxlint at lint time.
      oxc:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - oxlint-plugin-eslint
          - oxfmt
          - eslint-plugin-import

      # --- UI / client ---

      react:
        patterns:
          - react
          - react-dom
          - react-*
          - '@types/react*'
          - redux
          - redux-*
          - history

      material-ui:
        patterns:
          - '@material-ui/*'

      chartjs:
        patterns:
          - chart.js
          - '@types/chart.js'
          - react-chartjs-2

      i18next:
        patterns:
          - i18next
          - i18next-*
          - react-i18next

      # --- Server / API ---

      aws-sdk:
        # All @aws-sdk/* v3 packages share the same version number.
        patterns:
          - '@aws-sdk/*'

      express:
        patterns:
          - express
          - body-parser
          - express-*
          - helmet
          - morgan
          - cookie-parser
          - cookie-session
          - '@types/express*'
          - '@types/cookie*'
          - '@types/morgan'
          - '@types/body-parser'

      sequelize-pg:
        patterns:
          - sequelize
          - sequelize-*
          - pg
          - pg-*

      redis:
        patterns:
          - redis
          - redis-*
          - connect-redis
          - '@types/redis*'
          - '@types/connect-redis'

      bcrypt:
        patterns:
          - bcrypt
          - '@types/bcrypt'

      datadog:
        patterns:
          - dd-trace
          - '@datadog/*'

      date-fns:
        patterns:
          - date-fns
          - date-fns-*

      # --- Repo hygiene ---

      commitlint:
        patterns:
          - '@commitlint/*'
          - commitizen
          - cz-conventional-changelog

      husky-lint-staged:
        patterns:
          - husky
          - lint-staged

      # Catch-all for everything not matched above. Non-major only, so majors
      # of ungrouped packages still arrive as individual PRs.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

      # --- Security updates: mirror critical toolchains ---

      webpack-security:
        applies-to: security-updates
        patterns:
          - webpack
          - webpack-cli
          - webpack-dev-server

      typescript-security:
        applies-to: security-updates
        patterns:
          - typescript

      jest-security:
        applies-to: security-updates
        patterns:
          - jest
          - '@swc/jest'
          - testcafe

      express-security:
        applies-to: security-updates
        patterns:
          - express
          - express-*

      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom

  # Keeps SHA-pinned Actions (see .github/workflows/*.yml) refreshed instead
  # of going stale forever.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  # Keeps the digest-pinned base image (see Dockerfile*) refreshed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-base-images:
        patterns:
          - '*'
    ignore:
      # Node major upgrades are a deliberate migration (.nvmrc, CI, Docker).
      - dependency-name: node
        update-types:
          - version-update:semver-major
